name: Default
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Test
              run: bun run test:ci
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Lint
              run: bun run lint
            - name: Format Check
              run: bun run format:check
    build:
        name: Packed consumers (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24]
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Build
              run: bun run test:package
    spellcheck:
        name: Spellcheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5
            - name: Check spelling
              uses: crate-ci/typos@v1
