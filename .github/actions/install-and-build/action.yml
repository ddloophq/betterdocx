name: Install dependencies and build ⚙️
description: Install dependencies and build

runs:
    using: composite
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version-file: .bun-version
        - name: Install Dependencies
          shell: bash
          run: bun install --frozen-lockfile
        - name: Build
          shell: bash
          run: bun run build
