[files]
extend-exclude = [
    "docs/api/**",
    "library/ooxml-schemas/**",
    "library/demo/assets/**",
    "**/*.docx",
    "build/**",
    "dist/**",
    "coverage/**",
    "bun.lock",
]

[default]
extend-ignore-re = [
    # Inline / block spell-check suppressions (typos + legacy cspell comments)
    "(?Rm)^.*(#|//|/\\*|\\{/)\\s*(spellchecker:|cspell:)(disable-line|disable-next-line)",
    "(?s)(#|//|/\\*|\\{/)\\s*(spellchecker:|cspell):(disable|off).*?(#|//|/\\*|\\{/)\\s*(spellchecker:|cspell):(enable|on)",
    # OOXML namespaces, attributes, and long encoded values
    "\"w:[^\"]+\"",
    "\"s:[^\"]+\"",
    "\"a:[^\"]+\"",
    "\"pic:[^\"]+\"",
    "\"xmlns:[^\"]+\"",
    "\"vt:[^\"]+\"",
    "[^\\s]{40,}",
    "<xsd:[^>]+/>",
    "[A-Z_]+ = \"[^\"]+\"",
    "XmlAttributeComponent<\\{[^}]+}>",
    "xmlKeys = \\{[^}]+}",
    "\\.to\\.deep\\.equal\\(\\{[^)]+}\\)",
    "\\.to\\.include\\.members\\(\\[[^\\]]+\\]\\)",
    "new [a-zA-Z]+\\(\\{[^£]+}\\)",
    "<element name=\"[a-z]+\"",
    "<attribute name=\"[a-z]+\"",
    "key: \"[^\"]+\"",
    # xsd:dateTime format comment in values.ts
    "CCYY-MM-DDThh:mm:ss",
]
extend-ignore-identifiers-re = [
    # Short OOXML-style tokens
    "^[a-zA-Z]{1,4}$",
]

